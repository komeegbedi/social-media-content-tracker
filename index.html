<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ONE standards-compliant theme-color meta, set by src/theme.js to the
         RESOLVED theme (not the OS). Browsers that honour theme-color tint their
         chrome from it. NOTE: iOS Safari 26.5.2 does not reflect a MANUAL in-app
         override in the toolbar (it follows the device); "Match System" works.
         Verified platform limitation — no hacks. Colors match --background in
         src/styles.css (light #F7F7F8 / dark #08090A). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="theme-color-meta" content="#F7F7F8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>IFC Creatives Board</title>
    <meta name="description" content="Creative workflow management for the IFC Creative Team." />
    <meta name="apple-mobile-web-app-title" content="Creatives Board" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="IFC Creatives Board" />
    <meta property="og:description" content="Creative workflow management for the IFC Creative Team." />
    <meta property="og:type" content="website" />
    <!-- Apply the saved appearance synchronously, before any paint, so there is
         never a light/dark flash on load. Mirrors src/theme.js (system default). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("sb-appearance");
          if (p !== "system" && p !== "light" && p !== "dark") {
            var legacy = localStorage.getItem("sb-theme");
            p = (legacy === "light" || legacy === "dark") ? legacy : "system";
          }
          var dark = (p === "dark") || (p === "system" &&
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          // Match Safari's chrome + form controls to the resolved theme at first
          // paint, so there is no flash and the toolbar starts on the right color.
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          // Single-meta REPLACEMENT (identical to src/theme.js): drop the static
          // light tag and insert a fresh one at the resolved color, so a stored
          // Dark preference never briefly exposes the light value, and no stale
          // or duplicate theme-color tags can linger.
          var color = dark ? "#08090A" : "#F7F7F8";
          var olds = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
          var meta = document.createElement("meta");
          meta.setAttribute("name", "theme-color");
          meta.setAttribute("id", "theme-color-meta");
          meta.setAttribute("content", color);
          document.head.appendChild(meta);
        } catch (e) { /* no-op */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
